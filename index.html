<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Law Code App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0D0D0C;
      color: #FEFFDA;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      text-align: center;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 6px;
      color: #E2C97E;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 0 0 8px 0;
      color: #FEFFDA;
    }
    p {
      font-size: 14px;
      color: #B8B89A;
      line-height: 1.7;
      margin: 16px 0;
    }
    a {
      color: #E2C97E;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">thai</div>
    <h1>Law Code</h1>
    <p>รวมประมวลกฎหมายไทย<br>ค้นหา อ่าน บันทึก ได้ในแอปเดียว</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.lawcode.pro">ดาวน์โหลดจาก Google Play</a></p>
  </div>
</body>
</html>
